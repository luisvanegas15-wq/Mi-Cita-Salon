:root{--bg:#faf5f2;--card:#fff;--card2:#f6eee9;--ink:#2b1e2f;--mut:#7d6f7c;--line:#ece1db;--ac:#b8517a;--ac2:#f6dde6;--gold:#c08f3e;--ok:#2f8f6b;--okb:#dff1e9;--bad:#c4473d;--badb:#f8e0dd;--conf:#3c6fb0;--confb:#e2ebf7;--pend:#a1782a;--pendb:#f6ecd7}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 20px}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px;margin-bottom:10px}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--ac);color:#fff}.btn.dark{background:var(--ink);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.wa{background:#1f9d55;color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}.btn.full{width:100%}.btn.s{padding:6px 10px;font-size:13px;border-radius:10px}
.dots{border:0;background:none;color:var(--mut);font-size:18px;line-height:1;padding:2px 4px;cursor:pointer;letter-spacing:1px}
.btn.bad{background:var(--badb);color:var(--bad)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:70px;resize:vertical}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(184,81,122,.55),transparent 70%)}
.hero .mut{color:#cdbfcc}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.08);border-radius:14px;padding:10px}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:11.5px;color:#cdbfcc}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.st-pend{background:var(--pendb);color:var(--pend)}.st-conf{background:var(--confb);color:var(--conf)}.st-done{background:var(--okb);color:var(--ok)}.st-noshow{background:var(--badb);color:var(--bad)}.st-cancel{background:#eee;color:#888}
.ap{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ap:first-child{border-top:0;padding-top:2px}
.ap .t{width:52px;flex:none;text-align:right}
.ap .t b{display:block;font-size:16px}
.ap .bar{width:4px;border-radius:4px;background:var(--c,#b8517a);flex:none}
.ap.cancel{opacity:.5}
.free{display:flex;align-items:center;justify-content:space-between;border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;color:var(--mut);font-size:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}.acts:empty{display:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wd{border:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0;text-align:center;cursor:pointer}
.wd small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
.wd b{font-size:17px}
.wd i{display:block;height:6px;font-style:normal}
.wd i:after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.wd i.no:after{display:none}
.wd.on{background:var(--ink);color:#fff;border-color:var(--ink)}.wd.on small{color:#cdbfcc}
.wd.today b{color:var(--ac)}.wd.on.today b{color:#fff}
.cl{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.cl:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars span{width:100%;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:2px}
.bars small{font-size:11px;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;cursor:pointer;font-size:14px}
.pill.on{border-color:var(--ac);background:var(--ac2);color:var(--ac);font-weight:600}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 8px;cursor:pointer;min-width:58px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--ac);font-weight:600}
.hide{display:none!important}
#fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 8px 22px rgba(184,81,122,.45);z-index:21;cursor:pointer;line-height:1}
#ov{position:fixed;inset:0;background:rgba(43,30,47,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grip{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.empty{text-align:center;padding:24px 10px;color:var(--mut)}
.banner{background:var(--pendb);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.big{font-size:26px;font-weight:700}
.logo{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--ink);color:#fff;margin-bottom:10px}
a{color:var(--ac)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60}
.pin{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pin i.f{background:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.kp button{height:64px;border-radius:50%;border:0;background:var(--card);font-size:24px;font-weight:600;cursor:pointer;border:1px solid var(--line)}

function freeOne(d,pid){if(!B.days.includes(parse(d).getDay()))return[];const o=toMin(B.open),c=toMin(B.close);let cur=o;const out=[];

 const t=iso(today());if(d===t){const n=new Date(),nm=n.getHours()*60+n.getMinutes();return out.map(([a,b])=>[Math.max(a,Math.ceil(nm/15)*15),b]).filter(([a,b])=>b-a>=30)}return d<t?[]:out}

function range(p){const t=iso(today());if(p==='hoy')return[t,t];if(p==='semana'){const d=parse(t);d.setDate(d.getDate()-((d.getDay()+6)%7));return[iso(d),addD(iso(d),6)]}return[t.slice(0,8)+'01',t.slice(0,8)+'31']}

function drawPhotos(cid){const box=$('#phs');if(!box)return;photosDB('readonly',st=>{const r=st.index('cid').getAll(IDBKeyRange.only(cid));r.onsuccess=()=>{const b=$('#phs');if(!b)return;const l=(r.result||[]).sort((a,b)=>b.date.localeCompare(a.date));
 b.innerHTML=l.length?l.map(p=>`<img src="${p.data}" onclick="viewPhoto('${p.id}','${cid}')" alt="Trabajo ${dShort(p.date)}">`).join(''):'<span class="xs mut">Aún no hay fotos. Guarda aquí sus diseños para repetirlos.</span>'}});setTimeout(()=>{const b=$('#phs');if(b&&b.textContent==='Cargando…')b.innerHTML='<span class="xs mut">Las fotos no están disponibles en este navegador.</span>'},1500)}
function addPhoto(inp,cid,fromDone){const f=inp.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
 const data=c.toDataURL('image/jpeg',.72);photosDB('readwrite',(st,tx)=>{st.put({id:uid(),cid,date:iso(today()),data});tx.oncomplete=()=>{toast('Foto guardada 📷');if(!fromDone)drawPhotos(cid)}})};img.src=url}
function viewPhoto(id,cid){photosDB('readonly',st=>{const r=st.get(id);r.onsuccess=()=>{const p=r.result;if(!p)return;modal(`<img src="${p.data}" style="width:100%;border-radius:16px"><p class="sm mut" style="margin:8px 0">${esc(cli(cid).name)} · ${dLong(p.date)}</p>
 <div class="row"><a class="btn grow" href="${p.data}" download="micita-${p.date}.jpg">Descargar</a><button class="btn bad grow" onclick="photosDB('readwrite',(st,tx)=>{st.delete('${id}');tx.oncomplete=()=>openCli('${cid}')})">Eliminar</button></div><button class="btn ghost full" style="margin-top:8px" onclick="openCli('${cid}')">Volver</button>`)}})}
function clearDemo(){modal(`<h2>Empezar con tus datos</h2><p class="mut">Se borran los clientes y citas de ejemplo. Escribe los datos de tu negocio.</p>
 <label class="f">Tipo</label><select id="cdt">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('')}</select>
 <label class="f">Nombre del negocio</label><input id="cdn" placeholder="Ej: Nails by Caro"><label class="f">Tu nombre</label><input id="cdo"><div id="cde" class="err"></div>
 <button class="btn pri full" style="margin-top:14px" onclick="ob.type=document.querySelector('#cdt').value;ob.name=document.querySelector('#cdn').value;ob.owner=document.querySelector('#cdo').value;if(!ob.name.trim()||!ob.owner.trim()){document.querySelector('#cde').textContent='Completa los datos.';return}closeM();startApp()">Empezar</button>`)}

/* ---------- PIN y activación ---------- */
function vLock(){const p=pinFor?pro(pinFor):null;return `<div style="text-align:center;padding-top:50px"><div class="logo">${p?esc(initials(p.name)):'🔒'}</div><h2>${p?'Hola, '+esc(p.name.split(' ')[0]):esc(B.name)}</h2><p class="mut">${p?'Escribe tu PIN de profesional':'Escribe el PIN del salón'}</p><div class="pin">${[0,1,2,3].map(i=>`<i class="${pinBuf.length>i?'f':''}"></i>`).join('')}</div><div id="perr" class="err" style="min-height:20px"></div>
 <div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="pinKey('${k}')">${k}</button>`).join('')}</div>
 ${p?`<button class="btn ghost" style="margin-top:22px" onclick="pinFor=null;pinBuf='';render()">← Volver</button>`:actPR().some(x=>x.pin)?`<div style="margin-top:26px"><p class="sm mut" style="margin-bottom:8px">¿Eres del equipo?</p><div class="pills" style="justify-content:center">${actPR().filter(x=>x.pin).map(x=>`<button class="pill" onclick="pinFor='${x.id}';pinBuf='';render()"><span class="dot" style="background:${x.color}"></span>${esc(x.name.split(' ')[0])}</button>`).join('')}</div></div>`:''}</div>`}
function pinKey(k){if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
 if(pinBuf.length===4){const want=pinFor?pro(pinFor).pin:B.pin;if(pinBuf===want){pinBuf='';if(pinFor){asPro=pinFor;store.set('asPro',asPro);pinFor=null}else unlocked=true;render();return}pinBuf='';render();$('#perr').textContent='PIN incorrecto';return}render()}
function vActivar(){const end=lic&&lic.trial&&trialLeft()<=0;
 return `<div style="text-align:center;padding:30px 0 10px"><div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M9 15.5l2 2 4-4"/></svg></div><h1>Mi<span style="color:var(--ac)">Cita</span> <span style="font-size:.55em;color:var(--gold)">Salón</span></h1></div>
 ${end?`<div class="card" style="border-left:3px solid var(--ac)"><b>Tu prueba gratis terminó.</b><p class="sm mut" style="margin-top:4px">Tus citas, clientes y caja están guardadas. Activa tu código para seguir usándola.</p></div>`:''}
 <div class="card"><h2>Activa tu app</h2><p class="sm mut">Escribe tu nombre tal como lo diste en la compra y el código que recibiste.</p>
 <label class="f">Nombre completo</label><input id="an" placeholder="Ej: Carolina Gómez" autocomplete="name"><label class="f">Código de activación</label><input id="acd" placeholder="MS-XXXX-XXXX" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:2px">
 <div id="aerr" class="err"></div><button class="btn pri full" style="margin-top:14px" onclick="activar()">Activar</button></div>
 ${showAct?`<button class="btn ghost full" onclick="showAct=false;render()">Volver</button>`:`<button class="btn ghost full" onclick="dlBackup()">Descargar copia de mis datos</button>`}
 ${SOPORTE?`<p class="sm mut" style="text-align:center;margin-top:14px">¿Necesitas tu código? <a href="https://wa.me/${SOPORTE}">Escríbenos por WhatsApp</a></p>`:''}`}
function activar(){const n=$('#an').value.trim(),c=normC($('#acd').value);if(normN(n).length<3){$('#aerr').textContent='Escribe tu nombre completo.';return}
 if(!c||c!==codeFor(n)){$('#aerr').textContent='El código no coincide con ese nombre. Revisa que esté escrito igual que en tu compra.';return}
 lic={name:n,code:c,date:iso(today())};store.set('lic',lic);showAct=false;let nm=n.split(/\s+/)[0];nm=nm.charAt(0).toUpperCase()+nm.slice(1).toLowerCase();render();
 modal(`<div style="text-align:center"><div style="font-size:46px">💖</div><h2>¡Listo, ${esc(nm)}!</h2><p class="mut">MiCita Salón quedó activada para siempre. Que tu agenda se llene y tu negocio crezca.</p><button class="btn pri full" style="margin-top:14px" onclick="closeM()">Continuar</button></div>`)}

/* ---------- Diseño adaptable ---------- */
const isWide=()=>innerWidth>=900;let wideNow=isWide();
addEventListener('resize',()=>{const w=isWide();if(w!==wideNow){wideNow=w;if(B&&!getBooking())render()}});
function navHTML(){return `<div class="sb-top"><div class="sb-brand"><img src="icon-192.png" alt=""><div><b>${APPNAME}</b><span>${esc(B.name)}</span></div></div><button class="btn pri full" onclick="newAppt()">+ Nueva cita</button></div>`+Object.entries(NAV).map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${v[1]}</svg><span>${v[0]}</span></button>`).join('')}
function startDemo(){startDemo0();const t=iso(today());B.name='Studio Bella';B.owner='Carolina';
 PR=[{id:'p1',name:'Carolina Gómez',phone:'3001234567',comm:0,color:'#b8517a',on:true},{id:'p2',name:'Valentina Ruiz',phone:'3112223344',comm:40,color:'#3c6fb0',on:true,pin:'1111'},{id:'p3',name:'Sofía Mejía',phone:'3205556677',comm:45,color:'#2f8f6b',on:true,pin:'2222'}];
 let sd=5;const R=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let x=Math.imul(sd^sd>>>15,1|sd);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};
 AP.forEach(a=>{a.pid='p1'});
 const times=['08:00','09:00','10:00','11:00','13:30','14:30','15:30','16:30','17:30'];
 for(let d=-42;d<=6;d++){const day=addD(t,d),wd=parse(day).getDay();if(wd===0)continue;
  ['p2','p3'].forEach(pid=>{const n=d<0?2+Math.floor(R()*3):d===0?4:d===1?3:Math.floor(R()*3);const used=new Set();let last=0;
   for(let k=0;k<n;k++){let ti;let g=0;do{ti=times[Math.floor(R()*times.length)];g++}while((used.has(ti)||toMin(ti)<last)&&g<20);if(g>=20)break;const si=Math.floor(R()*SV.length),s=SV[si];if(toMin(ti)+s.dur>toMin(B.close))continue;used.add(ti);last=toMin(ti)+s.dur;
    const busy=new Set(AP.filter(x=>x.date===day).map(x=>x.cid));let ci,gg=0;do{ci=Math.floor(R()*10);gg++}while(busy.has('c'+ci)&&gg<30);let st=d<0?(R()<.06?'noshow':'done'):'pend';if(d>=1&&R()<.4)st='conf';
    AP.push({id:uid()+pid+k+'_'+d,cid:'c'+ci,sid:s.id,pid,add:[],date:day,time:ti,dur:s.dur,price:s.price,note:'',status:st,dep:null,paid:st==='done'?{amount:s.price,method:METHODS[Math.floor(R()*3)],tip:R()<.25?5000:0}:null,rem:0})}})}
 const nowM=new Date().getHours()*60+new Date().getMinutes();AP.filter(a=>a.date===t&&a.pid!=='p1').forEach(a=>{if(toMin(a.time)+a.dur<=nowM){a.status='done';a.paid={amount:a.price,method:'Nequi',tip:0}}});
 save();render()}
/* ---------- Vista del profesional ---------- */
let asPro=store.get('asPro',null),pinFor=null;
function proData(pid){const p=pro(pid),t=iso(today()),c=(p.comm||0)/100,o=toMin(B.open),cl=toMin(B.close);
 const ws=(()=>{const d=parse(t);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)})(),ms=t.slice(0,8)+'01';
 const mine=AP.filter(a=>a.pid===pid);
 const earn=(a,b)=>mine.filter(x=>x.date>=a&&x.date<=b).reduce((s,x)=>s+Math.round(apInc(x)*c)+apTip(x),0);
 const days=[];for(let i=0;i<7;i++){const d=addD(t,i);const l=mine.filter(a=>a.date===d&&a.status!=='cancel').sort((a,b)=>toMin(a.time)-toMin(b.time));const busy=l.filter(a=>a.status!=='noshow').reduce((s,a)=>s+(a.dur||60),0);
  days.push([d,B.days.includes(parse(d).getDay())?Math.min(100,Math.round(busy/(cl-o)*100)):-1,l.map(a=>[a.time,a.dur||60,cli(a.cid).name,svc(a.sid).name+addTxt(a),a.price,a.status,a.note||'',a.status==='done'?Math.round(apInc(a)*c)+apTip(a):Math.round(a.price*c)])])}
 const up=mine.filter(a=>a.date>=t&&a.date<=addD(t,6)&&(a.status==='pend'||a.status==='conf')).reduce((s,a)=>s+Math.round(a.price*c),0);
 return {n:B.name,pn:p.name,c:p.comm||0,col:p.color,g:t,gt:new Date().toTimeString().slice(0,5),et:earn(t,t),ew:earn(ws,t),em:earn(ms,t),up,days,mt:mine.filter(x=>x.date>=ms&&x.date<=t&&x.status==='done').length}}
function proURL(pid){return APP_URL+'#p='+b64e(JSON.stringify(proData(pid)))}
function getProView(){const h=location.hash;if(!h.startsWith('#p='))return null;try{return JSON.parse(b64d(h.slice(3)))}catch(e){return {err:1}}}
function vProPanel(D,live){if(D.err)return `<div class="empty" style="padding-top:80px">Este link no es válido. Pídele uno nuevo a tu salón.</div>`;
 const t=iso(today()),days=D.days.filter(([d])=>d>=t),td=days.find(([d])=>d===t);const nToday=td?td[2].filter(a=>a[5]!=='noshow').length:0;
 return `<div class="hero" style="background:linear-gradient(135deg,#2b1e2f,#2b1e2f)"><div class="mut sm">${esc(D.n)} · ${live?'Modo profesional':'Tu agenda'}</div><h1 style="margin-top:2px">Hola, ${esc(D.pn.split(' ')[0])} 👋</h1><div class="mut sm" style="position:relative;z-index:1">Comisión ${D.c}% · ${D.mt} servicio${D.mt===1?'':'s'} este mes</div>
 <div class="kpis"><div class="kpi"><b>${nToday}</b><span>citas hoy</span></div><div class="kpi"><b>${money(D.em)}</b><span>ganado este mes</span></div><div class="kpi"><b>${money(D.up)}</b><span>por ganar (7 días)</span></div></div></div>
 <div class="card"><h2>Tus ganancias</h2><div class="li"><span>Hoy</span><b>${money(D.et)}</b></div><div class="li"><span>Esta semana</span><b>${money(D.ew)}</b></div><div class="li"><span>Este mes</span><b>${money(D.em)}</b></div><p class="xs mut" style="margin-top:6px">Comisión de servicios atendidos más tus propinas.</p></div>
 ${days.map(([d,occ,l])=>`<div class="card"><div class="row between" style="margin-bottom:${l.length?8:0}px"><div><h2 style="margin:0;font-size:18px">${d===t?'Hoy · ':d===addD(t,1)?'Mañana · ':''}${cap(dLong(d))}</h2><div class="xs mut">${occ<0?'No trabajas este día':l.length+' cita'+(l.length===1?'':'s')+' · ocupación '+occ+'%'}</div></div>${occ>=0?`<div class="ob" style="max-width:90px"><i style="width:${occ}%;background:${D.col}"></i></div>`:''}</div>
  ${l.map(a=>`<div class="ap ${a[5]}"><div class="t"><b>${a[0]}</b><span class="xs mut">${fromMin(toMin(a[0])+a[1])}</span></div><div class="bar" style="--c:${D.col}"></div><div class="grow"><div class="row between"><b>${esc(a[2])}</b><span class="chip st-${a[5]}">${ST[a[5]]}</span></div><div class="sm mut">${esc(a[3])} · ${money(a[4])}</div>${a[6]?`<div class="xs mut">📝 ${esc(a[6])}</div>`:''}<div class="xs" style="color:var(--ok);font-weight:600;margin-top:2px">${a[5]==='done'?'Ganaste':a[5]==='noshow'?'No vino':'Tu comisión'}${a[5]==='noshow'?'':': '+money(a[7])}</div></div></div>`).join('')}</div>`).join('')}
 ${live?`<button class="btn dark full" onclick="exitPro()">Salir del modo profesional</button>`:`<p class="xs mut" style="text-align:center;margin:14px 0">Actualizado el ${dShort(D.g)} a las ${D.gt}. Pídele a ${esc(D.n)} un link nuevo para ver cambios.</p>`}
 <p class="xs mut" style="text-align:center;margin:16px 0">MiCita Salón · LV Studio</p>`}
function exitPro(){asPro=null;store.set('asPro',null);if(B.pin)unlocked=false;render()}
function enterPro(){const ps=actPR();modal(`<h2>👤 Modo profesional</h2><p class="sm mut">Deja la tablet o el celular del salón en la vista de un profesional: verá solo su agenda, su ocupación y sus comisiones, sin la caja ni los datos de los demás.</p>
 ${B.pin?'':`<div class="banner" style="margin-top:10px">💡 Pon un PIN del salón en Más → PIN para que nadie pueda salir de este modo sin tu permiso.</div>`}
 <div class="card" style="margin-top:10px">${ps.map(p=>`<div class="li" style="cursor:pointer" onclick="closeM();${p.pin?`pinFor='${p.id}';unlocked=false;asPro=null;pinBuf='';render()`:`asPro='${p.id}';store.set('asPro',asPro);render()`}"><span><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</span><span class="xs mut">${p.pin?'con PIN':'sin PIN'} ›</span></div>`).join('')}</div>`)}
function sendProAgenda(pid){const p=pro(pid),u=proURL(pid),txt=`Hola ${p.name.split(' ')[0]} 👋 Aquí tienes tu agenda de los próximos 7 días y tus comisiones en ${B.name}:\n\n${u}`;window._pu=u;
 modal(`<h2>📲 Agenda de ${esc(p.name.split(' ')[0])}</h2><p class="sm mut">Un link solo para ver: sus citas de los próximos 7 días, su ocupación y cuánto lleva ganado y por ganar. Envíaselo cada mañana o cuando cambie su agenda.</p>
 <div class="row" style="margin-top:12px"><button class="btn wa grow" onclick="window.open('https://wa.me/${phoneWA(p.phone)}?text='+encodeURIComponent(${JSON.stringify(txt).replace(/"/g,'&quot;')}),'_blank')">Enviar por WhatsApp</button><button class="btn grow" onclick="window.open(window._pu,'_blank')">Ver</button></div>
 ${p.phone?'':`<p class="xs mut" style="margin-top:8px">Agrega su celular en Equipo para que se abra directo su chat.</p>`}<button class="btn ghost full" style="margin-top:8px" onclick="vTeam()">Volver al equipo</button>`)}
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&B)render()});
</script>
